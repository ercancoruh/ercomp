[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ercomp"
version = "0.13.0"
description = "Terminal media browser — thumbnail TUI for images and video (Pillow + bundled ffmpeg)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "ErCo", email = "ercancoruh@ercancoruh.com" }]
keywords = [
  "terminal",
  "media",
  "player",
  "image",
  "video",
  "viewer",
  "cli",
  "ffmpeg",
  "truecolor",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics :: Viewers",
  "Topic :: Multimedia :: Video",
  "Topic :: Terminals",
]
dependencies = [
  "Pillow>=10.0.0",
  "imageio-ffmpeg>=0.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
ercomp = "ercomp.cli:main"

[project.urls]
Homepage = "https://github.com/ercancoruh/ercomp"
Repository = "https://github.com/ercancoruh/ercomp"
Issues = "https://github.com/ercancoruh/ercomp/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

# Keep setup.py for post-install mpv fetch on Windows
