[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ercomp"
version = "0.7.0"
description = "Terminal media player — batteries included (Pillow + bundled ffmpeg)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "ErCo", email = "ercancoruh@ercancoruh.com" }]
keywords = ["terminal", "media", "image", "viewer", "cli", "ffmpeg"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Viewers",
]
dependencies = [
  "Pillow>=10.0.0",
  "imageio-ffmpeg>=0.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
ercomp = "ercomp.cli:main"

[project.urls]
Homepage = "https://github.com/ercancoruh/ercomp"
Issues = "https://github.com/ercancoruh/ercomp/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
